<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Nova AI</title>

<style>
:root{
  --bg:#0b0d12;
  --panel:#12151c;
  --panel2:#181c25;
  --text:#f4f6fb;
  --muted:#9aa3b2;
  --line:#282e39;
  --accent:#7c5cff;
  --accent2:#35b6ff;
  --user:#272c38;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  height:100%;
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
  color:inherit;
}

.app{
  height:100dvh;
  display:flex;
  overflow:hidden;
}

/* SIDEBAR */

.side{
  width:280px;
  background:#0e1016;
  border-right:1px solid var(--line);
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  font-size:19px;
  padding:8px;
}

.logo{
  width:36px;
  height:36px;
  border-radius:12px;
  background:linear-gradient(
    135deg,
    var(--accent),
    var(--accent2)
  );
  display:grid;
  place-items:center;
  font-weight:900;
}

.new{
  width:100%;
  padding:12px 14px;
  border-radius:12px;
  background:var(--panel2);
  text-align:left;
}

.new:hover{
  background:#222734;
}

.history{
  overflow:auto;
  flex:1;
}

.history div{
  padding:11px;
  border-radius:10px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-bottom:4px;
}

.history div.active,
.history div:hover{
  background:var(--panel2);
  color:var(--text);
}

.side small{
  color:var(--muted);
  line-height:1.5;
}

/* MAIN */

.main{
  min-width:0;
  flex:1;
  display:flex;
  flex-direction:column;
}

.top{
  height:62px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
}

.model{
  font-weight:750;
}

.actions{
  display:flex;
  gap:8px;
}

.icon{
  width:40px;
  height:40px;
  border-radius:11px;
  background:transparent;
}

.icon:hover{
  background:var(--panel2);
}

/* CHAT */

.chat{
  flex:1;
  overflow:auto;
  padding:
    28px
    max(16px,calc((100% - 850px)/2));
  scroll-behavior:smooth;
}

.welcome{
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.welcome h1{
  font-size:clamp(30px,7vw,52px);
  margin:0 0 10px;
  background:
    linear-gradient(
      90deg,
      #fff,
      #a9b5ff,
      #65d1ff
    );
  -webkit-background-clip:text;
  color:transparent;
}

.welcome p{
  color:var(--muted);
  margin:0 auto 25px;
  max-width:550px;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:9px;
}

.chip{
  background:var(--panel);
  border:1px solid var(--line);
  padding:10px 13px;
  border-radius:14px;
  color:#cdd3df;
}

.chip:hover{
  border-color:var(--accent);
}

/* MESSAGE */

.msg{
  display:flex;
  gap:12px;
  margin:0 auto 24px;
  max-width:850px;
}

.avatar{
  width:34px;
  height:34px;
  flex:none;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:var(--panel2);
  font-size:15px;
}

.msg.user{
  justify-content:flex-end;
}

.msg.user .avatar{
  order:2;
  background:
    linear-gradient(
      135deg,
      var(--accent),
      #5a8dff
    );
}

.bubble{
  max-width:min(760px,85%);
  padding:12px 15px;
  border-radius:17px;
  line-height:1.6;
  overflow-wrap:anywhere;
}

.assistant .bubble{
  background:transparent;
  padding-left:0;
}

.user .bubble{
  background:var(--user);
}

.bubble pre{
  background:#080a0e;
  border:1px solid var(--line);
  padding:13px;
  border-radius:12px;
  overflow:auto;
}

.bubble code{
  background:#202530;
  padding:2px 5px;
  border-radius:5px;
}

/* TYPING */

.typing{
  display:flex;
  gap:4px;
  padding:10px 0;
}

.dot{
  width:7px;
  height:7px;
  background:#8d96a7;
  border-radius:50%;
  animation:b 1s infinite;
}

.dot:nth-child(2){
  animation-delay:.15s;
}

.dot:nth-child(3){
  animation-delay:.3s;
}

@keyframes b{
  50%{
    transform:translateY(-5px);
    opacity:.45;
  }
}

/* COMPOSER */

.composer{
  padding:
    12px
    max(12px,calc((100% - 850px)/2));
  padding-bottom:
    max(12px,env(safe-area-inset-bottom));
  background:
    linear-gradient(
      transparent,
      var(--bg) 18%
    );
}

.box{
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:20px;
  padding:10px 10px 10px 15px;
  display:flex;
  align-items:flex-end;
  gap:8px;
  box-shadow:0 8px 35px #0004;
}

.box textarea{
  flex:1;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  max-height:160px;
  min-height:42px;
  padding:9px 0;
  line-height:1.45;
}

.send{
  width:44px;
  height:44px;
  border-radius:14px;
  background:
    linear-gradient(
      135deg,
      var(--accent),
      #5e8fff
    );
  font-size:18px;
}

.send:disabled{
  opacity:.4;
}

.hint{
  text-align:center;
  color:#687181;
  font-size:11px;
  margin-top:8px;
}

/* MOBILE */

@media(max-width:720px){

  .side{
    display:none;
  }

  .top{
    height:56px;
  }

  .chat{
    padding:20px 12px;
  }

  .msg{
    margin-bottom:18px;
  }

  .bubble{
    max-width:91%;
  }

  .welcome h1{
    font-size:36px;
  }

  .composer{
    padding-left:10px;
    padding-right:10px;
  }

  .box{
    border-radius:18px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="side">

    <div class="brand">
      <div class="logo">N</div>
      Nova AI
    </div>

    <button class="new" id="newChat">
      ＋ Cuộc trò chuyện mới
    </button>

    <div class="history" id="history"></div>

    <small>
      Nova AI chạy qua dịch vụ web.
      Không cần API key trong file.
      Cần Internet để nhận câu trả lời.
    </small>

  </aside>


  <!-- MAIN -->
  <main class="main">

    <header class="top">

      <div class="model">
        Nova AI
        <span style="color:#7f8999;font-size:12px">
          • Web
        </span>
      </div>

      <div class="actions">

        <button
          class="icon"
          id="clear"
          title="Xóa chat">
          ⌫
        </button>

        <button
          class="icon"
          id="theme"
          title="Đổi giao diện">
          ☀
        </button>

      </div>

    </header>


    <!-- CHAT -->
    <section class="chat" id="chat">

      <div class="welcome" id="welcome">

        <div>

          <h1>
            Xin chào 👋
          </h1>

          <p>
            Hỏi mình bất cứ điều gì.
            Giao diện được tối ưu cho điện thoại
            và máy tính.
          </p>

          <div class="chips">

            <button class="chip">
              Giải thích một bài toán
            </button>

            <button class="chip">
              Viết code HTML
            </button>

            <button class="chip">
              Lên ý tưởng
            </button>

            <button class="chip">
              Dịch văn bản
            </button>

          </div>

        </div>

      </div>

    </section>


    <!-- INPUT -->
    <div class="composer">

      <div class="box">

        <textarea
          id="input"
          rows="1"
          placeholder="Nhắn tin với Nova AI..."
        ></textarea>

        <button
          class="send"
          id="send">
          ➤
        </button>

      </div>

      <div class="hint">
        Nova AI có thể mắc lỗi.
        Hãy kiểm tra thông tin quan trọng.
      </div>

    </div>

  </main>

</div>


<script>

/* =========================
   BIẾN
========================= */

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const send =
  document.getElementById("send");

const welcome =
  document.getElementById("welcome");

const historyEl =
  document.getElementById("history");


let messages =
  JSON.parse(
    localStorage.getItem("nova_messages") || "[]"
  );

let dark = true;


/* =========================
   ESCAPE HTML
========================= */

function esc(s){

  return s.replace(
    /[&<>"']/g,
    function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m];

    }
  );

}


/* =========================
   MARKDOWN ĐƠN GIẢN
========================= */

function md(s){

  let x = esc(s);

  x = x.replace(
    /```([\s\S]*?)```/g,
    "<pre><code>$1</code></pre>"
  );

  x = x.replace(
    /`([^`]+)`/g,
    "<code>$1</code>"
  );

  x = x.replace(
    /\*\*(.*?)\*\*/g,
    "<strong>$1</strong>"
  );

  x = x.replace(
    /\n/g,
    "<br>"
  );

  return x;

}


/* =========================
   HIỂN THỊ
========================= */

function render(){

  welcome.style.display =
    messages.length
      ? "none"
      : "flex";

  chat
    .querySelectorAll(".msg")
    .forEach(x => x.remove());

  messages.forEach(m => {

    addMessage(
      m.role,
      m.text,
      false
    );

  });

  renderHistory();

  scroll();

}


/* =========================
   MESSAGE
========================= */

function addMessage(
  role,
  text,
  save = true
){

  let row =
    document.createElement("div");

  row.className =
    "msg " + role;

  row.innerHTML =

    '<div class="avatar">' +

    (role === "user"
      ? "U"
      : "✦") +

    '</div>' +

    '<div class="bubble">' +

    md(text) +

    '</div>';

  chat.appendChild(row);


  if(save){

    messages.push({
      role:role,
      text:text
    });

    localStorage.setItem(
      "nova_messages",
      JSON.stringify(messages)
    );

  }

  scroll();

}


/* =========================
   LỊCH SỬ
========================= */

function renderHistory(){

  historyEl.innerHTML = "";

  if(messages.length){

    let d =
      document.createElement("div");

    d.className = "active";

    d.textContent =
      messages.find(
        x => x.role === "user"
      )?.text ||
      "Cuộc trò chuyện";

    historyEl.appendChild(d);

  }

}


/* =========================
   CUỘN XUỐNG
========================= */

function scroll(){

  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   GỬI CÂU HỎI
========================= */

async function ask(){

  let q =
    input.value.trim();

  if(!q || send.disabled)
    return;


  input.value = "";

  resize();

  welcome.style.display =
    "none";


  addMessage(
    "user",
    q
  );


  send.disabled = true;


  let row =
    document.createElement("div");

  row.className =
    "msg assistant";

  row.id =
    "typing";


  row.innerHTML =

    '<div class="avatar">✦</div>' +

    '<div class="bubble">' +

      '<div class="typing">' +

        '<i class="dot"></i>' +
        '<i class="dot"></i>' +
        '<i class="dot"></i>' +

      '</div>' +

    '</div>';


  chat.appendChild(row);

  scroll();


  try{

    /*
      DỊCH VỤ AI WEB CÔNG KHAI

      Không cần API KEY.

      Nếu dịch vụ thay đổi,
      bạn có thể thay URL ở đây.
    */

    const response =
      await fetch(
        "https://text.pollinations.ai/",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            model:"openai",

            messages:
              messages.map(m => ({
                role:m.role,
                content:m.text
              })),

            stream:false

          })

        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response
        .json()
        .catch(
          async () => ({
            content:
              await response.text()
          })
        );


    const answer =
      data.choices?.[0]
        ?.message?.content ||

      data.content ||

      data.text ||

      "Mình chưa nhận được câu trả lời.";


    row.remove();


    addMessage(
      "assistant",
      answer
    );


  }

  catch(error){

    row.remove();

    addMessage(
      "assistant",

      "⚠️ Không kết nối được dịch vụ AI lúc này." +

      "\n\nHãy kiểm tra Internet rồi thử lại." +

      "\n\nChi tiết: " +

      error.message
    );

  }

  finally{

    send.disabled = false;

    input.focus();

  }

}


/* =========================
   TỰ ĐỘNG ĐỔI CHIỀU CAO
========================= */

function resize(){

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      160
    ) + "px";

}


/* =========================
   ENTER GỬI
========================= */

input.addEventListener(
  "input",
  resize
);


input.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      ask();

    }

  }
);


send.onclick =
  ask;


/* =========================
   GỢI Ý
========================= */

document
  .querySelectorAll(".chip")
  .forEach(
    button => {

      button.onclick = () => {

        input.value =
          button.textContent;

        resize();

        input.focus();

      };

    }
  );


/* =========================
   CHAT MỚI
========================= */

document
  .getElementById("newChat")
  .onclick = () => {

    messages = [];

    localStorage.removeItem(
      "nova_messages"
    );

    render();

  };


/* =========================
   XÓA CHAT
========================= */

document
  .getElementById("clear")
  .onclick = () => {

    if(
      confirm(
        "Xóa toàn bộ cuộc trò chuyện?"
      )
    ){

      messages = [];

      localStorage.removeItem(
        "nova_messages"
      );

      render();

    }

  };


/* =========================
   DARK / LIGHT
========================= */

document
  .getElementById("theme")
  .onclick = () => {

    dark = !dark;


    document.documentElement
      .style.setProperty(
        "--bg",
        dark
          ? "#0b0d12"
          : "#f5f7fb"
      );


    document.documentElement
      .style.setProperty(
        "--panel",
        dark
          ? "#12151c"
          : "#ffffff"
      );


    document.documentElement
      .style.setProperty(
        "--panel2",
        dark
          ? "#181c25"
          : "#e9edf4"
      );


    document.documentElement
      .style.setProperty(
        "--text",
        dark
          ? "#f4f6fb"
          : "#111827"
      );


    document.documentElement
      .style.setProperty(
        "--muted",
        dark
          ? "#9aa3b2"
          : "#667085"
      );


    document.documentElement
      .style.setProperty(
        "--line",
        dark
          ? "#282e39"
          : "#d8dee8"
      );


    document.documentElement
      .style.setProperty(
        "--user",
        dark
          ? "#272c38"
          : "#e4e8f0"
      );

  };


/* =========================
   KHỞI ĐỘNG
========================= */

render();

</script>

</body>
</html>
