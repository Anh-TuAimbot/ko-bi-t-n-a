<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER KEY HUB v5.0</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #05050a;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(255, 0, 128, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 40%);
      color: #00f0ff;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .cyber-card {
      background: rgba(10, 10, 20, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 550px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      text-align: center;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 10px #00f0ff, 0 0 20px #ff007f;
      margin-bottom: 20px;
    }

    .tabs { display: flex; gap: 10px; margin-bottom: 25px; }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: rgba(112, 0, 255, 0.2);
      border: 1px solid #7000ff;
      border-radius: 8px;
      color: #a0a0c0;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: linear-gradient(90deg, #ff007f, #7000ff);
      color: #fff;
      border-color: #00f0ff;
      box-shadow: 0 0 15px rgba(255, 0, 128, 0.5);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      color: #e0e0e0;
      letter-spacing: 1px;
      font-size: 13px;
    }

    input, textarea {
      width: 100%;
      background: rgba(5, 5, 12, 0.9);
      border: 1px solid #7000ff;
      border-radius: 8px;
      padding: 12px;
      color: #00f0ff;
      font-family: 'Orbitron', monospace;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
    }

    .btn-cyber {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #00f0ff, #7000ff);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-cyber:hover {
      background: linear-gradient(90deg, #ff007f, #00f0ff);
      box-shadow: 0 0 30px rgba(255, 0, 128, 0.7);
    }

    #result {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-family: 'Orbitron', monospace;
      font-weight: bold;
      display: none;
    }

    .valid { background: rgba(0, 255, 102, 0.1); border: 1px solid #00ff66; color: #00ff66; text-shadow: 0 0 10px #00ff66; }
    .invalid { background: rgba(255, 0, 85, 0.1); border: 1px solid #ff0055; color: #ff0055; text-shadow: 0 0 10px #ff0055; }

    textarea { height: 160px; resize: none; margin-top: 8px; font-size: 12px; }
  </style>
</head>
<body>

  <div class="cyber-card">
    <h1>⚡ CYBER KEY SYSTEM ⚡</h1>

    <!-- Tabs chuyển đổi -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('check')">🔍 KIỂM TRA KEY</button>
      <button class="tab-btn" onclick="switchTab('generate')">⚡ TẠO KEY MỚI</button>
    </div>

    <!-- TAB 1: KIỂM TRA KEY -->
    <div id="check-tab" class="tab-content active">
      <div class="form-group">
        <label>NHẬP KEY CẦN XÁC NHẬN:</label>
        <input type="text" id="keyInput" placeholder="VD: APEX-ZENITH-SOLITUDE-EF86F1EF">
      </div>
      <button class="btn-cyber" onclick="verifyKey()">XÁC NHẬN KEY</button>
      <div id="result"></div>
    </div>

    <!-- TAB 2: TẠO KEY MỚI -->
    <div id="generate-tab" class="tab-content">
      <div class="form-group">
        <label>MẪU CỐ ĐỊNH (PREFIX):</label>
        <input type="text" id="prefix" value="APEX-ZENITH-SOLITUDE">
      </div>
      <div class="form-group">
        <label>SỐ LƯỢNG KEY CẦN SINH (ĐỔI ĐUÔI HEX):</label>
        <input type="number" id="count" value="5" min="1" max="100">
      </div>
      <button class="btn-cyber" onclick="generateKeys()">TẠO DANH SÁCH KEY</button>

      <div class="form-group" style="margin-top: 15px;">
        <label>KẾT QUẢ KHI TẠO KEY:</label>
        <textarea id="output" readonly placeholder="Danh sách Key thay đổi đuôi sẽ hiển thị ở đây..."></textarea>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tabName === 'check') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('check-tab').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('generate-tab').classList.add('active');
      }
    }

    // Hàm tạo 8 ký tự Hex ngẫu nhiên (A-F, 0-9) cho phần đuôi
    function makeRandomHex(length = 8) {
      const hexChars = '0123456789ABCDEF';
      let res = '';
      for (let i = 0; i < length; i++) {
        res += hexChars.charAt(Math.floor(Math.random() * hexChars.length));
      }
      return res;
    }

    // 1. Kiểm tra Key (Chấp nhận mọi đuôi Hex 8 ký tự đi kèm mẫu cố định)
    function verifyKey() {
      const key = document.getElementById('keyInput').value.trim().toUpperCase();
      const res = document.getElementById('result');
      res.style.display = 'block';

      const prefix = document.getElementById('prefix').value.trim().toUpperCase();
      
      // Kiểm tra xem Key có bắt đầu bằng tiền tố APEX-ZENITH-SOLITUDE và có đuôi 8 ký tự không
      const regex = new RegExp(`^${prefix}-[A-F0-9]{8}$`);

      if (regex.test(key) || key === "APEX-ZENITH-SOLITUDE-EF86F1EF") {
        res.className = 'valid';
        res.innerText = '✔ KEY HỢP LỆ (ACTIVATED)';
      } else {
        res.className = 'invalid';
        res.innerText = '✖ KEY KHÔNG TỒN TẠI HOẶC SAI ĐỊNH DẠNG!';
      }
    }

    // 2. Tạo danh sách Key tự đổi đuôi 8 ký tự Hex ở cuối
    function generateKeys() {
      const prefix = document.getElementById('prefix').value.trim().toUpperCase() || 'APEX-ZENITH-SOLITUDE';
      const count = parseInt(document.getElementById('count').value);
      let keyList = [];

      for (let i = 0; i < count; i++) {
        const randomHex = makeRandomHex(8); // Đổi đoạn đuôi 8 ký tự
        keyList.push(`${prefix}-${randomHex}`);
      }

      document.getElementById('output').value = keyList.join('\n');
    }
  </script>
</body>
</html>
