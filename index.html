<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Việt Nam - Trợ lý AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1020;
      color: #fff;
      min-height: 100vh;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* HEADER */
    header {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #111827;
      border-bottom: 1px solid #263148;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      font-size: 20px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #9ca3af;
      font-size: 13px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f59e0b;
    }

    .status-dot.ready {
      background: #22c55e;
    }

    /* CHAT */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 30px 15px 150px;
    }

    .chat-inner {
      width: 100%;
      max-width: 850px;
      margin: auto;
    }

    .welcome {
      text-align: center;
      margin: 80px auto 40px;
    }

    .welcome-icon {
      width: 75px;
      height: 75px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      font-size: 38px;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      box-shadow: 0 15px 40px rgba(99, 102, 241, .25);
    }

    .welcome h1 {
      margin-top: 22px;
      font-size: 30px;
    }

    .welcome p {
      margin-top: 10px;
      color: #9ca3af;
      line-height: 1.6;
    }

    .message {
      display: flex;
      gap: 12px;
      margin: 25px 0;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 38px;
      height: 38px;
      min-width: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: #1f2937;
    }

    .message.user .avatar {
      background: #4f46e5;
    }

    .bubble {
      max-width: 75%;
      padding: 14px 17px;
      border-radius: 16px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.ai .bubble {
      background: #151d2e;
      border: 1px solid #263148;
    }

    .message.user .bubble {
      background: #4f46e5;
    }

    /* INPUT */
    .input-area {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 15px;
      background: linear-gradient(
        transparent,
        #0b1020 25%
      );
    }

    .input-box {
      max-width: 850px;
      margin: auto;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 18px;
      display: flex;
      align-items: flex-end;
      padding: 8px;
      box-shadow: 0 -10px 40px rgba(0,0,0,.2);
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      padding: 12px;
      font-size: 15px;
      line-height: 1.5;
      max-height: 150px;
      font-family: inherit;
    }

    textarea::placeholder {
      color: #64748b;
    }

    button {
      border: none;
      cursor: pointer;
      color: white;
    }

    .send {
      width: 45px;
      height: 45px;
      border-radius: 13px;
      background: #4f46e5;
      font-size: 18px;
      transition: .2s;
    }

    .send:hover {
      background: #6366f1;
      transform: translateY(-1px);
    }

    .send:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .clear {
      padding: 9px 13px;
      border-radius: 9px;
      background: #1f2937;
      color: #cbd5e1;
      font-size: 13px;
    }

    .clear:hover {
      background: #374151;
    }

    .loading {
      display: inline-flex;
      gap: 5px;
      align-items: center;
    }

    .loading span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94a3b8;
      animation: bounce 1s infinite;
    }

    .loading span:nth-child(2) {
      animation-delay: .15s;
    }

    .loading span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: translateY(0);
      }

      40% {
        transform: translateY(-6px);
      }
    }

    .info {
      text-align: center;
      color: #64748b;
      font-size: 11px;
      margin-top: 8px;
    }

    .progress-container {
      display: none;
      max-width: 850px;
      margin: 0 auto 10px;
    }

    .progress-container.show {
      display: block;
    }

    .progress-text {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .progress {
      height: 5px;
      border-radius: 10px;
      background: #1e293b;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #06b6d4);
      transition: width .2s;
    }

    @media (max-width: 600px) {
      header {
        padding: 0 12px;
      }

      .logo {
        font-size: 17px;
      }

      .welcome {
        margin-top: 50px;
      }

      .welcome h1 {
        font-size: 24px;
      }

      .bubble {
        max-width: 85%;
      }

      .chat {
        padding-bottom: 145px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">
      <div class="logo-icon">🤖</div>
      <span>AI Việt Nam</span>
    </div>

    <div style="display:flex;align-items:center;gap:10px;">
      <button class="clear" onclick="clearChat()">
        Xóa chat
      </button>

      <div class="status">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">Chưa tải AI</span>
      </div>
    </div>
  </header>


  <main id="chat" class="chat">

    <div class="chat-inner" id="chatInner">

      <div class="welcome" id="welcome">

        <div class="welcome-icon">
          🤖
        </div>

        <h1>Xin chào! Tôi là AI</h1>

        <p>
          Hãy đặt câu hỏi cho tôi.<br>
          AI chạy trực tiếp trên trình duyệt và không cần API Key.
        </p>

      </div>

    </div>

  </main>


  <div class="input-area">

    <div id="progressContainer" class="progress-container">

      <div id="progressText" class="progress-text">
        Đang tải AI...
      </div>

      <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>

    </div>

    <div class="input-box">

      <textarea
        id="question"
        rows="1"
        placeholder="Nhập câu hỏi của bạn..."
        onkeydown="handleKey(event)"
      ></textarea>

      <button
        id="sendButton"
        class="send"
        onclick="sendMessage()"
        disabled
      >
        ➤
      </button>

    </div>

    <div class="info">
      AI chạy trực tiếp trên thiết bị của bạn • Không cần API Key
    </div>

  </div>

</div>


<script type="module">

  /*
   * WEBLLM
   * Chạy mô hình AI trực tiếp trên trình duyệt.
   */

  import * as webllm from
    "https://esm.run/@mlc-ai/web-llm";


  let engine = null;

  let messages = [
    {
      role: "system",
      content:
        "Bạn là một trợ lý AI thông minh. " +
        "Hãy trả lời bằng tiếng Việt nếu người dùng hỏi bằng tiếng Việt. " +
        "Trả lời chính xác, rõ ràng, dễ hiểu. " +
        "Nếu không chắc chắn về thông tin, hãy nói rõ rằng bạn không chắc chắn " +
        "thay vì bịa đặt."
    }
  ];


  /*
   * MODEL
   *
   * Model nhỏ để dễ chạy hơn trên máy phổ thông.
   *
   * Nếu máy mạnh, bạn có thể đổi sang model lớn hơn.
   */

  const MODEL = "Llama-3.2-1B-Instruct-q4f16_1-MLC";


  const statusText =
    document.getElementById("statusText");

  const statusDot =
    document.getElementById("statusDot");

  const progressContainer =
    document.getElementById("progressContainer");

  const progressBar =
    document.getElementById("progressBar");

  const progressText =
    document.getElementById("progressText");

  const sendButton =
    document.getElementById("sendButton");


  /*
   * TẢI AI
   */

  async function loadAI() {

    try {

      progressContainer.classList.add("show");

      statusText.textContent =
        "Đang tải AI...";

      const initProgressCallback =
        (report) => {

          if (report.progress) {

            const percent =
              Math.round(report.progress * 100);

            progressBar.style.width =
              percent + "%";

            progressText.textContent =
              "Đang tải mô hình AI: " +
              percent +
              "%";

          }

          if (report.text) {
            progressText.textContent =
              report.text;
          }

        };


      engine = await webllm.CreateMLCEngine(
        MODEL,
        {
          initProgressCallback
        }
      );


      statusText.textContent =
        "AI sẵn sàng";

      statusDot.classList.add("ready");

      progressContainer.classList.remove("show");

      sendButton.disabled = false;


    } catch (error) {

      console.error(error);

      statusText.textContent =
        "Không thể tải AI";

      progressText.textContent =
        "Trình duyệt hoặc thiết bị có thể không hỗ trợ WebGPU.";

      progressContainer.classList.add("show");

      alert(
        "Không thể khởi động AI.\n\n" +
        "Hãy thử Chrome/Edge phiên bản mới và bật WebGPU."
      );

    }

  }


  /*
   * GỬI CÂU HỎI
   */

  window.sendMessage = async function () {

    if (!engine) {
      alert("AI chưa sẵn sàng.");
      return;
    }


    const textarea =
      document.getElementById("question");

    const question =
      textarea.value.trim();


    if (!question) return;


    textarea.value = "";

    textarea.style.height = "auto";

    sendButton.disabled = true;


    /*
     * Ẩn màn hình chào
     */

    const welcome =
      document.getElementById("welcome");

    if (welcome) {
      welcome.style.display = "none";
    }


    /*
     * Hiện câu hỏi
     */

    addMessage(
      "user",
      question
    );


    messages.push({
      role: "user",
      content: question
    });


    /*
     * Loading
     */

    const loadingId =
      "loading-" + Date.now();

    addLoading(loadingId);


    try {

      const reply =
        await engine.chat.completions.create({

          messages: messages,

          temperature: 0.2,

          top_p: 0.9,

          max_tokens: 1024

        });


      const answer =
        reply.choices[0].message.content;


      removeLoading(loadingId);


      addMessage(
        "ai",
        answer
      );


      messages.push({
        role: "assistant",
        content: answer
      });


    } catch (error) {

      console.error(error);

      removeLoading(loadingId);

      addMessage(
        "ai",
        "Xin lỗi, đã xảy ra lỗi khi xử lý câu hỏi."
      );

    }


    sendButton.disabled = false;

  };


  /*
   * HIỆN TIN NHẮN
   */

  function addMessage(
    type,
    text
  ) {

    const chatInner =
      document.getElementById("chatInner");


    const message =
      document.createElement("div");

    message.className =
      "message " + type;


    const avatar =
      document.createElement("div");

    avatar.className =
      "avatar";

    avatar.textContent =
      type === "user"
        ? "👤"
        : "🤖";


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";

    bubble.textContent =
      text;


    message.appendChild(avatar);

    message.appendChild(bubble);

    chatInner.appendChild(message);


    scrollBottom();

  }


  /*
   * LOADING
   */

  function addLoading(id) {

    const chatInner =
      document.getElementById("chatInner");


    const message =
      document.createElement("div");

    message.className =
      "message ai";

    message.id =
      id;


    const avatar =
      document.createElement("div");

    avatar.className =
      "avatar";

    avatar.textContent =
      "🤖";


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";


    bubble.innerHTML = `
      <div class="loading">
        <span></span>
        <span></span>
        <span></span>
      </div>
    `;


    message.appendChild(avatar);

    message.appendChild(bubble);

    chatInner.appendChild(message);


    scrollBottom();

  }


  function removeLoading(id) {

    const element =
      document.getElementById(id);

    if (element) {
      element.remove();
    }

  }


  /*
   * CUỘN XUỐNG
   */

  function scrollBottom() {

    const chat =
      document.getElementById("chat");

    setTimeout(() => {

      chat.scrollTo({
        top: chat.scrollHeight,
        behavior: "smooth"
      });

    }, 50);

  }


  /*
   * ENTER ĐỂ GỬI
   */

  window.handleKey =
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    };


  /*
   * TỰ ĐỘNG TĂNG CHIỀU CAO TEXTAREA
   */

  document
    .getElementById("question")
    .addEventListener(
      "input",
      function() {

        this.style.height = "auto";

        this.style.height =
          Math.min(
            this.scrollHeight,
            150
          ) + "px";

      }
    );


  /*
   * XÓA CHAT
   */

  window.clearChat =
    function() {

      messages = [
        {
          role: "system",
          content:
            "Bạn là một trợ lý AI thông minh. " +
            "Hãy trả lời bằng tiếng Việt nếu người dùng hỏi bằng tiếng Việt. " +
            "Trả lời chính xác, rõ ràng, dễ hiểu. " +
            "Nếu không chắc chắn về thông tin, hãy nói rõ rằng bạn không chắc chắn."
        }
      ];


      const chatInner =
        document.getElementById("chatInner");


      chatInner.innerHTML = `

        <div class="welcome" id="welcome">

          <div class="welcome-icon">
            🤖
          </div>

          <h1>Xin chào! Tôi là AI</h1>

          <p>
            Hãy đặt câu hỏi cho tôi.<br>
            AI chạy trực tiếp trên trình duyệt và không cần API Key.
          </p>

        </div>

      `;

    };


  /*
   * BẮT ĐẦU
   */

  loadAI();

</script>

</body>
</html>
